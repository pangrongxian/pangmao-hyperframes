<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
        font-display: swap;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F7F5EE;
        font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1A1C20;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F7F5EE;
      }

      /* Subtle Paper Texture Radial Background */
      .paper-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, #FCFAF5 0%, #F5F1E6 100%);
        pointer-events: none;
        z-index: 0;
      }

      /* Architectural Subtle Grid (Exact Homage to 亚里) */
      .ambient-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(185, 170, 150, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(185, 170, 150, 0.22) 1.5px, transparent 1.5px);
        background-size: 54px 54px;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
