      .paper-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 35%, #FCFAF5 0%, #F5F1E6 100%);

        z-index: 0;

      .ambient-grid {

        inset: 0;
        background-image:

        pointer-events: none;
        z-index: 1;
