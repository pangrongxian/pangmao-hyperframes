    tl.to("#node-search", { className: "p-node active", duration: 0.2 }, 1.5);

    // Pointer glides to "点击复制"
    tl.to("#s3-pointer", { x: 860, y: 360, duration: 0.7, ease: "power2.inOut" }, 2.0);
    tl.to("#s3-pointer", { scale: 0.85, duration: 0.15, yoyo: true, repeat: 1 }, 2.8);
    tl.to("#node-copy", { className: "p-node active", duration: 0.2 }, 2.8);

    // Show Cursor Preview Card sliding up
    tl.call(() => {
      const c = document.getElementById("s3-cursor-card");
      if (c) c.style.display = "flex";
    }, null, 3.4);
    tl.fromTo("#s3-cursor-card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.2)" }, 3.5);

    // Code Typing simulation into prompt box
    const cmdStr = "npx skills add https://github.com/anthropics/skills --skill brainstorming";
    tl.call(() => {
      const el = document.getElementById("s3-prompt-text");
      let curr = 0;
      const interval = setInterval(() => {
        if (!el) { clearInterval(interval); return; }
        curr += 4;
        el.innerText = cmdStr.slice(0, curr) + (curr < cmdStr.length ? "▋" : "");
        if (curr >= cmdStr.length) {
          clearInterval(interval);
          el.innerText = cmdStr;
        }
      }, 35);
    }, null, 4.0);

    // Toast Success & Node Install lights up
    tl.to("#s3-toast", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 6.2);
    tl.to("#node-install", { className: "p-node active", duration: 0.3 }, 6.2);

      const sub = document.getElementById("s3-sub");
      if (sub) sub.innerHTML = "把代码直接丢进对话框，下一秒这个技能就<span class='sub-hl'>极速装好了</span>！";
    }, null, 6.5);

    tl.to("#root", { opacity: 0, duration: 0.25 }, 12.25);
